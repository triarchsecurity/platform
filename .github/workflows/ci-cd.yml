name: Triarch Platform CI/CD

# Thin caller of the canonical pipeline (shared-workflows ci-cd.yml @ release/v9).
# Repo-specific workflows kept: validate-apphosting, check-shared-version,
# promote-branch (OttoBot dispatch), publish-shared.
on:
  push:
    branches: [main, dev, 'release/**', 'hotfix/**']
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, dev]

permissions:
  contents: write
  packages: read

jobs:
  ci-cd:
    uses: triarchsecurity/shared-workflows/.github/workflows/ci-cd.yml@release/v9
    with:
      app_type: next-app
      project_key: triarch-dev
      firebase_project_id: triarch-dev-website
      app_hosting_backend: triarch-dev
      dev_backend: admin-dev
      prod_url: https://admin.triarch.dev
      dev_url: https://admin-dev.triarch.dev
      project_name: Triarch Platform
    secrets: inherit
